name: Stale issues and PRs

# Mark and close inactive issues and PRs. Call it on a schedule:
#
#   on:
#     schedule:
#       - cron: "0 6 * * *"
#   jobs:
#     stale:
#       uses: Specter099/.github/.github/workflows/stale.yml@main
#       permissions:
#         issues: write
#         pull-requests: write

on:
  workflow_call:
    inputs:
      days-before-issue-stale:
        description: Days of inactivity before an issue is marked stale
        type: number
        default: 60
      days-before-pr-stale:
        description: Days of inactivity before a PR is marked stale
        type: number
        default: 30
      days-before-close:
        description: Days after the stale label before closing
        type: number
        default: 14
      exempt-labels:
        description: Comma-separated labels that exempt issues and PRs
        type: string
        default: "pinned,security"

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had activity in ${{ inputs.days-before-issue-stale }} days. It will be
            closed in ${{ inputs.days-before-close }} days if no further activity
            occurs. If this issue is still relevant, please leave a comment or
            remove the stale label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had activity in ${{ inputs.days-before-pr-stale }} days. It
            will be closed in ${{ inputs.days-before-close }} days if no further
            activity occurs.
          days-before-issue-stale: ${{ inputs.days-before-issue-stale }}
          days-before-pr-stale: ${{ inputs.days-before-pr-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}
