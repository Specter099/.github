name: Python Build

# Test and build a Python package, then upload the distribution as the `dist`
# artifact. This workflow deliberately does NOT publish.
#
# PyPI Trusted Publishing verifies the job_workflow_ref OIDC claim, which for a
# job inside a reusable workflow names THIS file, not the caller's. The
# publishing job must therefore live in the caller's own workflow file (the one
# registered as the Trusted Publisher). Call it like this:
#
#   on:
#     release:
#       types: [published]
#   jobs:
#     build:
#       uses: Specter099/.github/.github/workflows/python-build.yml@main
#       permissions:
#         contents: read
#     publish:
#       needs: build
#       runs-on: ubuntu-latest
#       environment:
#         name: pypi
#         url: https://pypi.org/project/ssmtree/
#       permissions:
#         id-token: write
#       steps:
#         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
#           with:
#             name: dist
#             path: dist/
#         - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the test matrix
        type: string
        default: '["3.11","3.12"]'
      build-python-version:
        description: Python version used to build the distribution
        type: string
        default: "3.12"
      install-command:
        description: >-
          Single install command for test dependencies. Shell operators are
          not interpreted.
        type: string
        default: 'pip install -e .[dev]'
      test-command:
        description: >-
          Single test command, run after install. Shell operators are not
          interpreted. Lint and type checks belong in CI, not here.
        type: string
        default: "pytest"

jobs:
  test:
    name: "Test (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          pip install --upgrade pip
          set -f
          $INSTALL_COMMAND

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -f
          $TEST_COMMAND

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.build-python-version }}

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
