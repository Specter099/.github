name: Validate S3 Bucket Names

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: "3.12"
      scan-path:
        description: Directory to scan for bucket names
        type: string
        default: "."
      template-dir:
        description: >
          Directory containing synthesized CloudFormation *.template.json files
          (e.g. cdk.out). When provided, scans templates instead of (or in
          addition to) Python source. Omit to use Python source scan only.
        type: string
        default: ""

jobs:
  validate-bucket-names:
    name: S3 Bucket Naming Convention
    # Skip Dependabot PRs — they don't introduce new bucket_name= kwargs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: validate-bucket-names-${{ github.ref }}
      cancel-in-progress: true
    # Read-only: violations are reported in the job log, which names every
    # file and line. (A PR comment used to repeat a fixed template on every
    # failing push and needed pull-requests: write for it.)
    permissions:
      contents: read

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout .github repo (for shared scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Specter099/.github
          # Pin the scripts to the same commit this reusable workflow was
          # loaded from, so workflow and scripts always move together
          # instead of the scripts floating on main independently.
          ref: ${{ job.workflow_sha }}
          path: .shared-github
          # Only the validation script is needed — skip cloning the rest of
          # this repo. job.workflow_sha pins this checkout to the reusable
          # workflow commit (S6 / WF004). actionlint's context model does
          # not include it yet; local-ci.sh ignores that false positive.
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate S3 bucket names
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          TEMPLATE_DIR: ${{ inputs.template-dir }}
        run: |
          args=()
          [ -n "$SCAN_PATH" ]    && args+=(--path "$SCAN_PATH")
          [ -n "$TEMPLATE_DIR" ] && args+=(--template-dir "$TEMPLATE_DIR")
          python .shared-github/scripts/validate_bucket_names.py "${args[@]}"
