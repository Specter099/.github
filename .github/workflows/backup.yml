name: Backup to S3

on:
  schedule:
    - cron: "0 2 * * 0"  # weekly, Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    uses: ./.github/workflows/repo-backup.yml
    with:
      s3-bucket: ${{ vars.BACKUP_S3_BUCKET }}
      environment: production
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
