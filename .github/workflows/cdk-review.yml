name: CDK Review

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region to deploy to
        type: string
        default: "us-east-1"
      environment:
        description: GitHub environment to use (controls which secrets/vars are loaded)
        type: string
        default: "production"
      cdk-version:
        description: >-
          CDK CLI npm version. Empty/unset falls back to
          `vars.CDK_CLI_VERSION` in the calling repo, then to the
          hardcoded default in the setup-cdk action.
        type: string
        default: ""
      smoke-test-url:
        description: >-
          Unused in review — accepted for interface consistency with the
          deploy workflow
        type: string
        default: ""
      require-aws:
        description: >-
          Fail the job when no AWS_ROLE_ARN is available. When false, synth,
          diff, CDK Nag and Access Analyzer are skipped with a warning and the
          job can still pass, so only set false for repos that deliberately
          have no AWS access.
        type: boolean
        default: true
      enable-access-analyzer:
        description: >-
          Run IAM Access Analyzer CheckNoPublicAccess against synthesized
          templates (requires AWS_ROLE_ARN).
        type: boolean
        default: true
      enable-ci-logs:
        description: Ship detailed step logs to S3/CloudWatch
        type: boolean
        default: false
      ci-log-destination:
        description: "Log destination: s3, cloudwatch, or both"
        type: string
        default: "s3"
      ci-log-s3-bucket:
        description: >-
          S3 bucket for CI logs. Empty/unset falls back to
          `vars.CI_LOGS_BUCKET` in the calling repo. Required when
          ci-log-destination includes 's3'.
        type: string
        default: ""
      ci-log-cloudwatch-group:
        description: >-
          CloudWatch Logs group name. Empty/unset falls back to
          `vars.CI_LOGS_LOG_GROUP` in the calling repo. Required when
          ci-log-destination includes 'cloudwatch'.
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        description: >-
          IAM role ARN for OIDC federation. Optional as a secret: an
          AWS_ROLE_ARN repository or environment variable works too. With
          neither, the job fails unless require-aws is false.
        required: false
jobs:
  review:
    name: Synth & Diff
    # Skip Dependabot PRs (typically SHA-pin bumps). A skipped required
    # check is treated as passing by branch protection.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cdk-review-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    environment: ${{ inputs.environment }}
    env:
      # Secret first, variable second: the `||` order is the only thing that
      # makes a secret win when both exist.
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
    steps:
      # This job runs PR-authored code with AWS credentials and a write-scoped
      # token. Under pull_request_target that code could come from a fork, so
      # refuse outright rather than trusting every caller to get it right.
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::This workflow must not be called from a pull_request_target trigger. Use pull_request." >&2
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Init CI log directory
        if: ${{ inputs.enable-ci-logs }}
        run: mkdir -p "$RUNNER_TEMP/ci-logs"

      - name: Setup CDK
        uses: Specter099/.github/.github/actions/setup-cdk@main
        with:
          cdk-version: ${{ inputs.cdk-version != '' && inputs.cdk-version || vars.CDK_CLI_VERSION }}

      # setup-cdk already installs requirements.txt — only bring in
      # requirements-dev.txt here (ruff, pytest, pip-audit, …).
      - name: Install dev dependencies
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # Cheap static checks before any AWS / synth work so a lint or SAST
      # failure skips the expensive credentialed path.
      - name: Lint (ruff)
        if: hashFiles('requirements-dev.txt') != ''
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          _run_lint() {
            if command -v ruff &> /dev/null; then
              ruff check .
            else
              echo "::notice::ruff not installed — skipping lint"
            fi
          }
          if [ "$ENABLE_LOGS" = "true" ]; then
            _run_lint 2>&1 | tee "$RUNNER_TEMP/ci-logs/ruff-check.log"
          else
            _run_lint
          fi

      - name: SAST scan (bandit)
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          pip install bandit==1.9.4
          if [ "$ENABLE_LOGS" = "true" ]; then
            bandit -r . -ll --exclude ./.venv,./cdk.out,./lambda_layer 2>&1 | tee "$RUNNER_TEMP/ci-logs/bandit.log"
          else
            bandit -r . -ll --exclude ./.venv,./cdk.out,./lambda_layer
          fi

      - name: Unit tests
        if: hashFiles('tests/**') != ''
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          _run_tests() {
            if command -v pytest &> /dev/null; then
              pytest tests/ -v || rc=$?
              if [ "${rc:-0}" -eq 5 ]; then
                echo "::notice::no tests collected — skipping"
              elif [ "${rc:-0}" -ne 0 ]; then
                exit "$rc"
              fi
            else
              echo "::notice::pytest not installed — skipping tests"
            fi
          }
          if [ "$ENABLE_LOGS" = "true" ]; then
            _run_tests 2>&1 | tee "$RUNNER_TEMP/ci-logs/pytest.log"
          else
            _run_tests
          fi

      - name: Dependency audit
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          # Installed here rather than left to the caller's dev requirements:
          # otherwise the audit silently skipped for every repo without it.
          pip install pip-audit==2.10.1
          _run_audit() {
            pip-audit -r requirements.txt
          }
          if [ "$ENABLE_LOGS" = "true" ]; then
            _run_audit 2>&1 | tee "$RUNNER_TEMP/ci-logs/pip-audit.log"
          else
            _run_audit
          fi

      # Fail closed: a review that cannot reach AWS has run none of synth,
      # diff, CDK Nag or Access Analyzer, and must not satisfy a required
      # check by passing anyway.
      - name: AWS credentials not configured
        if: env.AWS_ROLE_ARN == ''
        env:
          REQUIRE_AWS: ${{ inputs.require-aws }}
        run: |
          if [ "$REQUIRE_AWS" = "true" ]; then
            echo "::error::No AWS_ROLE_ARN (secret or variable) — cannot synth/diff. Set one, or pass require-aws: false to skip the AWS checks deliberately." >&2
            exit 1
          fi
          echo "::warning::AWS_ROLE_ARN not set and require-aws is false — skipping synth, diff, CDK Nag and Access Analyzer"

      - name: Configure AWS credentials
        id: configure-aws-credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          # Shortest STS allows. This job runs PR-authored code, so a leaked
          # credential should expire quickly.
          role-duration-seconds: 900
          aws-region: ${{ inputs.aws-region }}

      - name: CDK Synth
        if: env.AWS_ROLE_ARN != ''
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          if [ "$ENABLE_LOGS" = "true" ]; then
            cdk synth 2>&1 | tee "$RUNNER_TEMP/ci-logs/cdk-synth.log"
          else
            cdk synth
          fi

      - name: IAM Access Analyzer — no public access
        if: env.AWS_ROLE_ARN != '' && inputs.enable-access-analyzer
        uses: Specter099/.github/.github/actions/access-analyzer@main
        with:
          template-dir: cdk.out
          aws-region: ${{ inputs.aws-region }}

      - name: CDK Nag (informational)
        if: env.AWS_ROLE_ARN != ''
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          set -o pipefail
          # Run synth on its own so a synth failure fails the step, then grep
          # the captured output. grep finding no Nag lines is fine (|| true) —
          # previously the single pipeline swallowed synth errors too.
          if ! CDK_NAG=true cdk synth --output cdk-nag.out > "$RUNNER_TEMP/cdk-nag-synth.log" 2>&1; then
            cat "$RUNNER_TEMP/cdk-nag-synth.log"
            echo "::error::cdk synth failed during CDK Nag run"
            exit 1
          fi
          if [ "$ENABLE_LOGS" = "true" ]; then
            grep -E "^\[.*Nag\]|AwsSolutions" "$RUNNER_TEMP/cdk-nag-synth.log" | tee "$RUNNER_TEMP/ci-logs/cdk-nag.log" || true
          else
            grep -E "^\[.*Nag\]|AwsSolutions" "$RUNNER_TEMP/cdk-nag-synth.log" || true
          fi

      - name: CDK Diff
        if: env.AWS_ROLE_ARN != ''
        id: diff
        env:
          ENABLE_LOGS: ${{ inputs.enable-ci-logs }}
        run: |
          # Reuses the cdk.out from the "CDK Synth" step above instead of
          # letting `cdk diff` re-synthesize — cuts this job from 3 synths to
          # 2. Not pointed at the CDK Nag synth's assembly: that one writes
          # to cdk-nag.out (see the CDK Nag step) specifically so it can't
          # contaminate this one with cdk_nag Metadata.
          diff_output=$(cdk diff --app cdk.out 2>&1) || true
          echo "$diff_output"
          # Random delimiter: diff text is PR-derived, and a line reading
          # exactly a fixed delimiter would end the block early and let the
          # rest forge further step outputs.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "diff<<$delim"
            echo "$diff_output"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          if [ "$ENABLE_LOGS" = "true" ]; then
            echo "$diff_output" > "$RUNNER_TEMP/ci-logs/cdk-diff.log"
          fi

      - name: Comment diff on PR
        if: env.AWS_ROLE_ARN != '' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DIFF: ${{ steps.diff.outputs.diff }}
        with:
          script: |
            // GitHub comment bodies are capped at 65536 chars — truncate
            // large diffs instead of failing the comment API call.
            const MAX_DIFF = 60000;
            let diff = process.env.DIFF || '';
            if (diff.length > MAX_DIFF) {
              diff = diff.slice(0, MAX_DIFF)
                + '\n… diff truncated — see the workflow run logs for the full output.';
            }
            const body = `### CDK Diff\n\n\`\`\`\n${diff}\n\`\`\``;
            // Paginate: listComments returns 30 per page, so on a busy PR
            // the existing diff comment would be missed and duplicated.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('### CDK Diff')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Generate log metadata
        if: always() && inputs.enable-ci-logs
        uses: Specter099/.github/.github/actions/log-metadata@main
        with:
          log-dir: ${{ runner.temp }}/ci-logs

      - name: Ship CI logs
        if: always() && inputs.enable-ci-logs && steps.configure-aws-credentials.outcome == 'success'
        uses: Specter099/.github/.github/actions/ship-logs@main
        with:
          log-dir: ${{ runner.temp }}/ci-logs
          destination: ${{ inputs.ci-log-destination }}
          s3-bucket: ${{ inputs.ci-log-s3-bucket != '' && inputs.ci-log-s3-bucket || vars.CI_LOGS_BUCKET }}
          cloudwatch-log-group: ${{ inputs.ci-log-cloudwatch-group != '' && inputs.ci-log-cloudwatch-group || vars.CI_LOGS_LOG_GROUP }}
          aws-region: ${{ inputs.aws-region }}

      - name: Skip CI log shipping (no AWS credentials)
        if: always() && inputs.enable-ci-logs && steps.configure-aws-credentials.outcome != 'success'
        run: echo "::notice::Skipping CI log shipping — no working AWS credentials for this run (secret unset or OIDC assume-role failed)."
