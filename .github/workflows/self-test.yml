name: Self Test

# PR check for this repo's own scripts and workflow YAML. Per repo convention,
# checks trigger on pull_request to main only; main correctness is covered by
# branch protection.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Single entrypoint shared with local development, so that a green
      # `./scripts/local-ci.sh` on a laptop means a green check here. Stages:
      # yamllint, ruff, pytest, workflow invariants, actionlint; zizmor runs
      # advisory. Add or remove stages in the script, not here.
      - name: CI gate (scripts/local-ci.sh)
        run: ./scripts/local-ci.sh --format github
