name: IAM Access Analyzer — No Public Access

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region for Access Analyzer API calls
        type: string
        default: us-east-1
      template-dir:
        description: >-
          Directory containing CDK-synthesized CloudFormation *.template.json files.
          Leave empty to skip (e.g. repos with no CDK app — use yaml-template-dir instead).
        type: string
        default: cdk.out
      yaml-template-dir:
        description: >-
          Directory containing CloudFormation *.yaml/*.yml templates to scan.
          Templates are converted to JSON via cfn-flip before scanning.
          Leave empty to skip YAML conversion (default).
        type: string
        default: ""
      fail-on-public-access:
        description: Fail the job when public access is detected (set false for warn-only)
        type: boolean
        default: true
      environment:
        description: >-
          GitHub environment to deploy into. The environment must have an AWS_ROLE_ARN
          secret set to the IAM role ARN to assume via OIDC.
        type: string
        default: production
    secrets:
      AWS_ROLE_ARN:
        description: >-
          IAM role ARN for OIDC federation. Optional as a secret: an
          AWS_ROLE_ARN repository or environment variable works too.
        required: false

permissions:
  id-token: write  # OIDC token for AWS authentication
  contents: read

jobs:
  check-no-public-access:
    name: Check No Public Access
    # Skip Dependabot PRs — they don't change CloudFormation templates.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: access-analyzer-check-${{ github.ref }}
      cancel-in-progress: true
    environment: ${{ inputs.environment }}
    env:
      # Secret first, variable second: the `||` order is the only thing that
      # makes a secret win when both exist. `vars` resolves against the
      # caller's repository (and its environment, since this job binds one).
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The ARN can come from a secret or a variable (see AWS_ROLE_ARN in the
      # job env), so neither is `required:`. Fail here with a clear message
      # rather than inside configure-aws-credentials on an empty role.
      - name: Verify a role ARN is available
        if: env.AWS_ROLE_ARN == ''
        run: |
          echo "::error::No AWS_ROLE_ARN available. Set it as a secret or a variable on the calling repo (or its environment)." >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ inputs.aws-region }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # No pip cache: setup-python fails the job when the caller has no
          # requirements.txt/pyproject.toml (e.g. CloudFormation YAML-only
          # repos), and the action installs its own pinned deps anyway.
          python-version: "3.12"

      - name: Check no public access
        uses: Specter099/.github/.github/actions/access-analyzer@main
        with:
          template-dir: ${{ inputs.template-dir }}
          yaml-template-dir: ${{ inputs.yaml-template-dir }}
          fail-on-public-access: ${{ inputs.fail-on-public-access }}
          aws-region: ${{ inputs.aws-region }}
