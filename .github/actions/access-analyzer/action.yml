name: IAM Access Analyzer — Check No Public Access
description: >
  Scans synthesized CloudFormation templates in cdk.out using AWS IAM Access Analyzer
  checkNoPublicAccess API. AWS credentials must be configured before calling this action.

inputs:
  template-dir:
    description: >
      Directory containing CDK-synthesized CloudFormation *.template.json files.
      Leave empty to skip (e.g. repos with no CDK app — use yaml-template-dir instead).
    default: cdk.out
  yaml-template-dir:
    description: >
      Directory containing CloudFormation *.yaml/*.yml templates to convert and scan.
      Leave empty to skip.
    default: ""
  fail-on-public-access:
    description: >-
      Fail when public access is detected (set 'false' to only warn about
      findings). An incomplete scan (unparseable template, API error) always
      fails, since it hasn't shown the templates are safe.
    default: "true"
  aws-region:
    description: AWS region for Access Analyzer API calls
    default: us-east-1

runs:
  using: composite
  steps:
    - name: Install access analyzer dependencies
      shell: bash
      run: pip install --quiet boto3==1.43.102 cfn-flip==1.3.0

    - name: Convert CloudFormation YAML templates to JSON
      if: inputs.yaml-template-dir != ''
      shell: bash
      env:
        YAML_DIR: ${{ inputs.yaml-template-dir }}
      run: |
        mkdir -p cfn-yaml-out
        # A template that fails to convert would otherwise just go unscanned
        # while the rest pass, so any conversion failure fails the step.
        failed=0
        while read -r f; do
          out="cfn-yaml-out/$(basename "${f%.*}").template.json"
          if cfn-flip "$f" "$out"; then
            echo "Converted: $f -> $out"
          else
            echo "::error::cfn-flip could not convert $f"
            failed=1
          fi
        done < <(find "$YAML_DIR" -maxdepth 1 \( -name "*.yaml" -o -name "*.yml" \))
        exit "$failed"

    - name: Check no public access
      id: check
      shell: bash
      env:
        TEMPLATE_DIR: ${{ inputs.template-dir }}
        YAML_TEMPLATE_DIR: ${{ inputs.yaml-template-dir != '' && 'cfn-yaml-out' || '' }}
        FAIL_ON_PUBLIC_ACCESS: ${{ inputs.fail-on-public-access }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -o pipefail
        # Single source of truth: the repo-root scripts/check_no_public_access.py.
        # $GITHUB_ACTION_PATH points at this action dir (.github/actions/access-analyzer).
        SCRIPT="$GITHUB_ACTION_PATH/../../../scripts/check_no_public_access.py"

        FAIL_FLAG="--fail-on-public-access"
        [ "$FAIL_ON_PUBLIC_ACCESS" = "true" ] || FAIL_FLAG="--no-fail-on-public-access"

        rc=0
        if [ -n "$TEMPLATE_DIR" ]; then
          python3 "$SCRIPT" --template-dir "$TEMPLATE_DIR" \
            --aws-region "$AWS_REGION" "$FAIL_FLAG" || rc=$?
        fi
        if [ -n "$YAML_TEMPLATE_DIR" ]; then
          python3 "$SCRIPT" --template-dir "$YAML_TEMPLATE_DIR" \
            --aws-region "$AWS_REGION" "$FAIL_FLAG" || rc=$?
        fi
        exit "$rc"

    # Only the check step's own failure means public access (or an incomplete
    # scan); an earlier pip or cfn-flip failure must not be reported as one.
    - name: Notify on public access detected
      if: failure() && steps.check.outcome == 'failure'
      shell: bash
      run: echo "::error::IAM Access Analyzer found public access or could not complete the scan. Review the job output for details."
